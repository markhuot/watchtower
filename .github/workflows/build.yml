name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache libghostty
        id: cache-libghostty
        uses: actions/cache@v4
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out/share
          key: libghostty-${{ runner.os }}-${{ hashFiles('.gitmodules', 'ghostty/**/*.zig', 'ghostty/**/*.zon', 'ghostty/build.zig', 'ghostty/build.zig.zon') }}
          save-always: true

      - name: Install Zig
        if: steps.cache-libghostty.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build libghostty
        if: steps.cache-libghostty.outputs.cache-hit != 'true'
        working-directory: ghostty
        run: zig build -Doptimize=ReleaseFast -Demit-docs=false -Demit-xcframework=true -Demit-macos-app=false

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build Watchtower
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Watchtower.xcodeproj \
            -scheme Watchtower \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Bundle Ghostty resources
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/Build/Products/Release/Watchtower.app/Contents/Resources
          SHARE=ghostty/zig-out/share

          # Shell integration & themes
          cp -R "$SHARE/ghostty" "$APP/ghostty"

          # Terminfo (needed for the ghostty TERM type and resource auto-detection)
          cp -R "$SHARE/terminfo" "$APP/terminfo"

          # Re-sign since we modified the bundle contents
          codesign --force --sign "Developer ID Application" \
            --timestamp \
            --options runtime \
            "$APP/../.."

      - name: Notarize app
        if: github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/Build/Products/Release

          # Create a zip for notarization
          ditto -c -k --keepParent Watchtower.app Watchtower-notarize.zip

          # Submit for notarization and wait
          xcrun notarytool submit Watchtower-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee notarize-output.txt

          # Extract submission ID and fetch the log if notarization failed
          SUBMISSION_ID=$(grep 'id:' notarize-output.txt | head -1 | awk '{print $2}')
          if grep -q 'status: Invalid' notarize-output.txt; then
            echo "::error::Notarization failed. Fetching detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          # Staple the notarization ticket to the app
          xcrun stapler staple Watchtower.app

          rm Watchtower-notarize.zip notarize-output.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watchtower.app
          path: build/Build/Products/Release/Watchtower.app

      - name: Determine release version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          PREFIX=$(date -u +"%Y.%m")
          # Find the highest existing release number for this month
          LAST=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName | startswith(\"${PREFIX}.\")) | .tagName | split(\".\")[2] | tonumber] | max // 0")
          NEXT=$(printf "%02d" $((LAST + 1)))
          echo "tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: github.ref == 'refs/heads/main'
        run: |
          cd build/Build/Products/Release
          zip -r -y Watchtower.app.zip Watchtower.app
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Watchtower ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            Watchtower.app.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
