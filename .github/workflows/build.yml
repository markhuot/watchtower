name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build libghostty
        working-directory: ghostty
        run: zig build -Doptimize=ReleaseFast -Demit-docs=false -Demit-xcframework=true -Demit-macos-app=false

      - name: Build Watchtower
        run: |
          xcodebuild \
            -project Watchtower.xcodeproj \
            -scheme Watchtower \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watchtower.app
          path: build/Build/Products/Release/Watchtower.app

      - name: Determine release version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          PREFIX=$(date -u +"%Y.%m")
          # Find the highest existing release number for this month
          LAST=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName | startswith(\"${PREFIX}.\")) | .tagName | split(\".\")[2] | tonumber] | max // 0")
          NEXT=$(printf "%02d" $((LAST + 1)))
          echo "tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: github.ref == 'refs/heads/main'
        run: |
          cd build/Build/Products/Release
          zip -r -y Watchtower.app.zip Watchtower.app
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Watchtower ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            Watchtower.app.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
